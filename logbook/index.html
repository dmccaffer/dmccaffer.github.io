<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dave's CESR Logbook Hub</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="favicon.ico" type="image/x-icon">

    <style>
        :root {
            --bg-light: #e6f0fa;
            --bg-dark: #121212;
            --text-light: #222;
            --text-dark: #f5f5f5;
            --primary: #005EB8; /* NHS Blue */
            --primary-hover: #003f7d;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #0072CE, #005EB8);
            color: var(--text-light);
            transition: background-color 0.3s, color 0.3s;
        }

        @media (prefers-color-scheme: dark) {
            body {
                background: linear-gradient(135deg, #0a0a0a, #1a1a1a);
                color: var(--text-dark);
            }
        }

        .container {
            background: rgba(255,255,255,0.9);
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 8px 24px rgba(0,0,0,0.2);
            max-width: 600px;
            margin: 20px;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 2rem;
        }

        .button {
            display: inline-block;
            padding: 20px 40px;
            margin: 20px;
            font-size: 1.5rem;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 10px;
            text-decoration: none;
            transition: transform 0.3s, box-shadow 0.3s, background-color 0.3s;
        }

        .button:hover {
            background-color: var(--primary-hover);
            transform: scale(1.05);
            box-shadow: 0 6px 16px rgba(0,0,0,0.3);
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Dave's CESR Logbook Hub</h1>

        <a class="button" href="https://docs.google.com/forms/d/e/1FAIpQLSdY00isVyB66a6avajsFIRLtfARsI-vvRVemhB31MD6kioc4A/viewform?usp=header" target="_blank">
            Patient / Procedure Log
        </a>

        <a class="button" href="https://docs.google.com/forms/d/e/1FAIpQLSfK7lk69hIqWTGS_oQF9FENEXKxLa4bqjVb_EwRx8BH9OQi3A/viewform?usp=header" target="_blank">
            CPD Diary
        </a>
    </div>
</body>
</html>
